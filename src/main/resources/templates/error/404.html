<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Página Não Encontrada - 404</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f8f9fa;
                color: #333;
                text-align: center;
                padding: 50px;
            }

            .container {
                max-width: 600px;
                margin: 0 auto;
                background: white;
                padding: 40px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            h1 {
                font-size: 72px;
                margin: 0;
                color: #dc3545;
            }

            h2 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            p {
                color: #6c757d;
                margin-bottom: 30px;
            }

            .btn {
                display: inline-block;
                background-color: #007bff;
                color: white;
                padding: 10px 20px;
                text-decoration: none;
                border-radius: 5px;
            }

            .details {
                margin-top: 30px;
                text-align: left;
                background: #f1f3f5;
                padding: 15px;
                border-radius: 5px;
                font-size: 14px;
            }
        </style>
    </head>
    <body>

        <div class="container">
            <!-- Exibe dinamicamente o código do erro (será 404) -->
            <h1 th:text="${status}">404</h1>

            <h2>Ops! Página não encontrada</h2>

            <!-- Mensagem amigável explicativa -->
            <p>O link que você tentou acessar pode estar quebrado, digitado incorretamente ou a página foi removida do
                sistema.</p>

            <!-- Botão que redireciona de volta para a rota raiz do seu sistema -->
            <a th:href="@{/}" class="btn">Voltar para a Página Inicial</a>

            <!-- Painel de detalhes sobre a URL não encontrada -->
            <div class="details">
                <strong>URL Acessada:</strong> <span th:text="${path}">/rota-invalida</span><br/>
                <strong>Mensagem:</strong> <span
                    th:text="${message != null ? message : 'Nenhum detalhe adicional disponível'}">Não Encontrado</span><br/>
                <strong>Horário:</strong> <span th:text="${timestamp}">01/08/2026 12:00:00</span>
            </div>
        </div>

    </body>
</html>
